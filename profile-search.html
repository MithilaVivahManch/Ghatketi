<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>बायोडाटा खोजें | मिथिला विवाह मंच</title>
<style>
:root{--bg:#f6efe9;--paper:#fff;--ink:#231942;--muted:#5d536d;--rose:#d4537e;--rose-soft:rgba(212,83,126,.12);--violet:#5541a8;--gold:#e9a93b;--line:rgba(35,25,66,.1);--shadow:0 18px 44px rgba(35,25,66,.1)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Nirmala UI","Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(212,83,126,.14),transparent 28%),radial-gradient(circle at bottom right,rgba(85,65,168,.13),transparent 30%),linear-gradient(180deg,#fbf6f1,var(--bg))}a{color:inherit;text-decoration:none}.shell{max-width:1120px;margin:auto;padding:20px 16px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}.brand img{width:48px;height:48px;object-fit:contain;background:white;border-radius:14px;padding:4px;box-shadow:0 8px 24px #23194218}.pill{padding:11px 17px;border:1px solid var(--line);border-radius:999px;background:#ffffffc9;font-weight:800}.hero{border-radius:28px;padding:clamp(25px,5vw,48px);color:#fff;background:linear-gradient(120deg,rgba(35,25,66,.96),rgba(85,65,168,.86)),url('images/cover_foto.png') center/cover;box-shadow:var(--shadow)}.eyebrow{display:inline-block;border:1px solid #ffffff55;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.15;margin:16px 0 10px}.hero p{line-height:1.8;margin:0;max-width:700px;color:#fff0f6}.panel{margin-top:22px;padding:clamp(18px,3vw,28px);background:#ffffffdf;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.panel h2{margin:0 0 7px;font-size:24px}.sub{margin:0 0 20px;color:var(--muted);line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;min-height:48px;padding:0 22px;background:linear-gradient(135deg,var(--ink),var(--violet));color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.status{margin:18px 0 0;color:var(--muted);line-height:1.7}.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.results-head h2{margin:0}.count{color:var(--violet);font-weight:900}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:18px}

/* ---------- card ---------- */
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 28px #2319420f;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px #23194222}}
.photo{position:relative;height:260px;background:linear-gradient(135deg,#eee5f3,#f9e8ee);display:grid;place-items:center;color:#6b5a7b;font-weight:800;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:70px;background:linear-gradient(180deg,transparent,rgba(35,25,66,.28));pointer-events:none}
.cardbody{padding:18px 18px 18px;display:flex;flex-direction:column;flex:1}
.card h3{margin:0;font-size:21px;line-height:1.3;font-weight:900;overflow-wrap:anywhere}
.age{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin:8px 0 14px;padding:5px 12px;border-radius:999px;background:var(--rose-soft);color:#a8325b;font-size:14px;font-weight:800}
.meta{display:grid;gap:0;margin-bottom:16px;font-size:14px;line-height:1.5}
.meta .row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px dashed var(--line)}
.meta .row:first-child{border-top:0}
.meta .k{color:var(--muted);font-weight:700;white-space:nowrap}
.meta .v{color:var(--ink);font-weight:800;text-align:right;overflow-wrap:anywhere}
.wa{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:6px;min-height:48px;border-radius:14px;background:linear-gradient(135deg,#25d366,#1db954);color:#05230e;font-weight:900;box-shadow:0 8px 18px #25d36633;transition:filter .2s}
.wa:hover{filter:brightness(1.06)}
.empty{grid-column:1/-1;text-align:center;padding:30px 18px;background:#fff;border:1px dashed #cfc2dc;border-radius:18px;color:var(--muted);line-height:1.8}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:25px;line-height:1.7}

/* ---------- STRONG profile: gradient border + glow + badge ---------- */
.card.strong{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--rose),var(--gold) 50%,var(--violet)) border-box;box-shadow:0 14px 38px rgba(212,83,126,.22),0 0 0 4px rgba(233,169,59,.10)}
@media(hover:hover){.card.strong:hover{box-shadow:0 22px 48px rgba(212,83,126,.3),0 0 0 4px rgba(233,169,59,.16)}}
.badge-strong{position:absolute;top:12px;left:12px;z-index:3;display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,#f6c453,#e08a1e);color:#3a2300;font-size:12.5px;font-weight:900;letter-spacing:.2px;box-shadow:0 6px 16px rgba(224,138,30,.45)}

@media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:230px}}
@media(max-width:520px){.shell{padding:14px 12px 36px}.topbar{align-items:flex-start}.brand{font-size:16px}.brand img{width:42px;height:42px}.topbar .pill{font-size:13px;padding:10px 12px}.hero{border-radius:20px}.cards{grid-template-columns:1fr}.photo{height:280px}.actions .btn{width:100%}}
</style>
</head>
<body><main class="shell">
<header class="topbar"><a class="brand" href="./"><img src="images/mithila1.png" alt="मिथिला विवाह मंच लोगो" onerror="this.style.display='none'"><span>मिथिला विवाह मंच</span></a><a class="pill" href="./about.html">हमारे बारे में</a></header>
<section class="panel" aria-live="polite"><div class="results-head"><h2>उपलब्ध प्रोफाइल</h2><span class="count" id="count"></span></div><div class="cards" id="cards"><div class="empty">आपकी खोज के परिणाम यहाँ दिखाई देंगे।</div></div><div class="actions" id="moreWrap" style="display:none"><button class="btn secondary" id="moreBtn" type="button">और प्रोफाइल देखें</button></div></section>
<footer class="foot">मिथिला विवाह मंच · परिवार आपस में सीधे संपर्क कर सकते हैं।<br>प्रोफाइल की जानकारी संबंधित परिवार से सत्यापित कर लें।</footer>
</main>
<script>
const API_BASE = 'https://mithila-sync-api.vercel.app/api/sync-pull';
const WHATSAPP_NUMBER = '918291823690';
const PAGE_SIZE = 20;
const LOGO_URL = 'images/mithila1.png';   // logo_ / logo- wali photo ki jagah ye dikhega

// profile_rating agar number hai to itna ya usse zyada = "Strong" (apne scale ke hisaab se badlein)
const STRONG_MIN_NUMBER = 8;

// index.html ke dropdown ke codes -> Hindi naam
const GOTRA_LABELS = {
  SHANDILYA: 'शाण्डिल्य', SAVARNA: 'सवर्ण', VATS: 'वत्स', KASHYAP: 'काश्यप',
  BHARDWAJ: 'भारद्वाज', KAUSHIK: 'कौशिक', KATYAYAN: 'कात्यायन', PARASHAR: 'पराशर',
  MUDGAL: 'मुद्गल', KRISHNATRE: 'कृष्णात्रेय', GAUTAM: 'गौतम'
};

const cardsEl  = document.getElementById('cards');
const countEl  = document.getElementById('count');
const moreWrap = document.getElementById('moreWrap');
const moreBtn  = document.getElementById('moreBtn');

let statusEl = document.getElementById('status');
if (!statusEl) {
  statusEl = document.createElement('p');
  statusEl.id = 'status';
  statusEl.className = 'status';
  cardsEl.parentNode.insertBefore(statusEl, cardsEl);
}

/* ================= styles (photo blur + lock) ================= */
(function injectStyles() {
  const css = `
    .photo{position:relative}
    .photo.is-logo{background:#fff}
    .photo.is-logo::after{display:none}
    .photo.is-logo img{object-fit:contain;padding:28px}
    .photo.blurred img{filter:blur(5px);transform:scale(1.15)}
    .photo-lock{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;color:#fff;background:rgba(20,12,40,.45);font-weight:800;line-height:1.4}
    .photo-lock .lock-icon{font-size:28px}
    .photo-lock small{font-weight:600;opacity:.95}
  `;
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);
})();

/* ================= URL se search values ================= */
const qs = new URLSearchParams(location.search);
const query = {
  profile_type: String(qs.get('profile_type') || '').toUpperCase(),
  age_min: qs.get('age_min'),
  age_max: qs.get('age_max'),
  exclude_gotra: String(qs.get('exclude_gotra') || qs.get('gotra') || '').trim().toUpperCase()
};

let currentPage = 1;
let shown = 0;
let hasMore = false;
let loading = false;

/* ================= helpers ================= */
function hasVal(v) {
  if (v === null || v === undefined) return false;
  const s = String(v).trim();
  return s !== '' && !/^(null|undefined|na|n\/a|none|-+)$/i.test(s);
}

function gotraLabel(g) {
  if (!hasVal(g)) return '';
  const key = String(g).trim().toUpperCase();
  return GOTRA_LABELS[key] || String(g).trim();
}

// Birthdate -> poori ho chuki saalon me umar (2000-05-14, 14/05/2000, epoch sab chalega)
function calcAge(dob) {
  if (!hasVal(dob)) return null;
  const s = String(dob).trim();
  let d, m;
  if (/^\d{10,13}$/.test(s)) {
    d = new Date(s.length === 10 ? Number(s) * 1000 : Number(s));
  } else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) {
    d = new Date(+m[1], +m[2] - 1, +m[3]);
  } else if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) {
    d = new Date(+m[3], +m[2] - 1, +m[1]);
  } else {
    d = new Date(s);
  }
  if (!d || isNaN(d.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  if (now.getMonth() < d.getMonth() || (now.getMonth() === d.getMonth() && now.getDate() < d.getDate())) age--;
  return age >= 0 && age < 120 ? age : null;
}

// DOB se calculate, na mile to table ki age
function getAge(p) {
  const a = calcAge(p.date_of_birth);
  if (a !== null) return a;
  const n = Number(p.age);
  return Number.isFinite(n) && n > 0 ? n : null;
}

// profile_rating "Strong" ho to true (text: "Strong"/"strong"; number: >= STRONG_MIN_NUMBER)
function isStrong(p) {
  const r = p.profile_rating;
  if (!hasVal(r)) return false;
  const s = String(r).trim();
  if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s) >= STRONG_MIN_NUMBER;
  return /strong|मजबूत|मज़बूत/i.test(s);
}

// sirf Government job dikhani hai
function isGovernment(jobType) {
  if (!hasVal(jobType)) return false;
  const s = String(jobType).trim().toLowerCase();
  if (/non[\s-]*gov|private|प्राइवेट|निजी|गैर/.test(s)) return false;
  return /gov|govt|सरकारी|सरकार/.test(s);
}

// Sirf primary photo dikhani hai (baaki photos me biodata/contact ho sakta hai)
function getPrimaryImage(p) {
  const url = String(p.remote_primary_image_url || '').trim();
  return /^https?:\/\//i.test(url) ? url : '';
}

// file ka naam "logo_" ya "logo-" se shuru ho to wo asli profile photo nahi hai
function isLogoImage(url) {
  let name;
  try {
    name = decodeURIComponent(new URL(url).pathname.split('/').pop() || '');
  } catch (e) {
    name = String(url).split(/[?#]/)[0].split('/').pop() || '';
  }
  return /^logo[_-]/i.test(name.trim());
}

function makeWhatsAppLink(p) {
  const age = getAge(p);
  const lines = [
    'नमस्कार, मुझे मिथिला विवाह मंच की वेबसाइट पर यह प्रोफाइल पसंद आई है।',
    'नाम: ' + (hasVal(p.full_name) ? String(p.full_name).trim() : '—')
  ];
  const add = (label, val) => { if (hasVal(val)) lines.push(label + ': ' + String(val).trim()); };
  add('प्रोफाइल', p.profile_type === 'BRIDE' ? 'वधू' : 'वर');
  if (age !== null) lines.push('आयु: ' + age + ' वर्ष');
  add('ऊँचाई', p.height);
  add('गोत्र', gotraLabel(p.gotra));
  add('शिक्षा', p.education);
  add('प्रोफेशन', p.profession || p.occupation);
  add('वर्तमान स्थान', p.location_current);
  add('Profile ID', p.id);
  lines.push('कृपया इस प्रोफाइल की पूरी जानकारी बताएं।');
  return 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(lines.join('\n'));
}

function showMessage(html) {
  cardsEl.innerHTML = '<div class="empty">' + html + '</div>';
}

/* ================= cards ================= */
function buildPhoto(p) {
  const photo = document.createElement('div');
  photo.className = 'photo';

  const url = getPrimaryImage(p);
  if (!url) {
    photo.textContent = 'फोटो उपलब्ध नहीं';
    return photo;
  }

  // logo wali image ho to Mithila Vivah Manch ka logo dikhao (blur nahi)
  if (isLogoImage(url)) {
    photo.classList.add('is-logo');
    const logo = document.createElement('img');
    logo.src = LOGO_URL;
    logo.alt = 'मिथिला विवाह मंच';
    logo.addEventListener('error', () => {
      photo.classList.remove('is-logo');
      photo.textContent = 'फोटो उपलब्ध नहीं';
    });
    photo.appendChild(logo);
    return photo;
  }

  const img = document.createElement('img');
  img.alt = 'प्रोफाइल की फोटो (धुंधली)';
  img.loading = 'lazy';
  img.addEventListener('error', () => {
    photo.classList.remove('blurred');
    photo.textContent = 'फोटो उपलब्ध नहीं';
  });
  img.src = url;

  const lock = document.createElement('div');
  lock.className = 'photo-lock';
  lock.innerHTML =
    '<span class="lock-icon">🔒</span>' +
    '<small>रजिस्टर्ड सदस्यों को ही फोटो दिखाई जाती है</small>';

  photo.classList.add('blurred');
  photo.append(img, lock);
  return photo;
}

function renderProfiles(profiles) {
  for (const p of profiles) {
    const strong = isStrong(p);

    const card = document.createElement('article');
    card.className = 'card' + (strong ? ' strong' : '');

    const body = document.createElement('div');
    body.className = 'cardbody';

    // naam
    const h3 = document.createElement('h3');
    h3.textContent = hasVal(p.full_name) ? String(p.full_name).trim() : 'नाम उपलब्ध नहीं';
    body.appendChild(h3);

    // naam ke turant niche: umar (birthdate se calculate)
    const age = getAge(p);
    if (age !== null) {
      const ageEl = document.createElement('div');
      ageEl.className = 'age';
      ageEl.textContent = 'आयु: ' + age + ' वर्ष';
      body.appendChild(ageEl);
    }

    // baaki details
    const meta = document.createElement('div');
    meta.className = 'meta';
    [
      ['गोत्र', gotraLabel(p.gotra)],
      ['प्रोफेशन', p.profession || p.occupation],
      ['नौकरी', isGovernment(p.job_type) ? 'सरकारी' : ''],
      ['ऊँचाई', p.height]
    ].forEach(([label, val]) => {
      if (!hasVal(val)) return;               // khali ho to row dikhani hi nahi
      const row = document.createElement('div');
      row.className = 'row';
      const k = document.createElement('span');
      k.className = 'k';
      k.textContent = label;
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = String(val).trim();
      row.append(k, v);
      meta.appendChild(row);
    });
    if (meta.children.length) body.appendChild(meta);

    const link = document.createElement('a');
    link.className = 'wa';
    link.href = makeWhatsAppLink(p);
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = '💬 पूरी जानकारी लें';
    body.appendChild(link);

    if (strong) {
      const badge = document.createElement('span');
      badge.className = 'badge-strong';
      badge.textContent = '⭐ मज़बूत प्रोफाइल';
      card.appendChild(badge);
    }

    card.append(buildPhoto(p), body);
    cardsEl.appendChild(card);
  }
}

/* ================= API call ================= */
async function loadProfiles(append) {
  if (loading) return;
  loading = true;
  moreBtn.disabled = true;

  if (!append) {
    currentPage = 1;
    shown = 0;
    cardsEl.innerHTML = '';
    countEl.textContent = '';
    moreWrap.style.display = 'none';
  }
  statusEl.textContent = 'प्रोफाइल खोजी जा रही हैं…';

  const params = new URLSearchParams({
    only_with_image: 1,
    profile_type: query.profile_type,
    age_min: query.age_min,
    age_max: query.age_max,
    page: String(currentPage),
    limit: String(PAGE_SIZE)
  });
  if (query.exclude_gotra) params.set('exclude_gotra', query.exclude_gotra);

  try {
    const response = await fetch(API_BASE + '?' + params.toString(), {
      headers: { Accept: 'application/json' }
    });
    let data = null;
    try { data = await response.json(); } catch (e) { /* JSON nahi mila */ }

    if (!response.ok || !data || data.ok === false) {
      throw new Error((data && (data.error || data.message)) || ('HTTP ' + response.status));
    }

    const profiles = Array.isArray(data.profiles) ? data.profiles : [];
    shown += profiles.length;

    if (!profiles.length && !append) {
      showMessage('इस उम्र और गोत्र के अनुसार कोई प्रोफाइल नहीं मिली।<br>कृपया उम्र बदलकर <a href="./#profile-search"><b>फिर खोजें</b></a>।');
      statusEl.textContent = '';
      countEl.textContent = '0 प्रोफाइल';
    } else {
      renderProfiles(profiles);
      const total = Number.isFinite(Number(data.total)) ? Number(data.total) : shown;
      countEl.textContent = total + ' प्रोफाइल';
      statusEl.textContent = shown + ' प्रोफाइल दिखाई जा रही हैं।';
    }

    hasMore = Boolean(data.has_more);
    moreWrap.style.display = hasMore ? 'flex' : 'none';
  } catch (err) {
    console.error('Profile load failed:', err);
    if (!append) {
      showMessage('प्रोफाइल लोड नहीं हो पाईं। कृपया कुछ देर बाद फिर कोशिश करें।<br><small>' +
        String(err.message || err).replace(/</g, '&lt;') + '</small>');
    }
    statusEl.textContent = 'API कनेक्शन में समस्या है। (अगर Console में CORS error दिखे तो Vercel में ALLOWED_ORIGIN जाँचें।)';
    countEl.textContent = '';
    moreWrap.style.display = 'none';
  } finally {
    loading = false;
    moreBtn.disabled = false;
  }
}

moreBtn.addEventListener('click', () => {
  if (hasMore) { currentPage += 1; loadProfiles(true); }
});

/* ================= page khulte hi search ================= */
(function init() {
  const min = Number(query.age_min);
  const max = Number(query.age_max);
  const valid =
    ['GROOM', 'BRIDE'].includes(query.profile_type) &&
    Number.isFinite(min) && Number.isFinite(max) && min >= 18 && max >= min;

  if (!valid) {
    statusEl.textContent = '';
    showMessage('कृपया पहले मुख्य पेज से खोज करें।<br><a href="./#profile-search"><b>🔎 खोज पेज पर जाएँ</b></a>');
    return;
  }

  const who = query.profile_type === 'BRIDE' ? 'वधू' : 'वर';
  const g = GOTRA_LABELS[query.exclude_gotra] || query.exclude_gotra;
  statusEl.textContent = 'खोज: ' + who + ' · आयु ' + min + '–' + max + ' वर्ष' +
    (g ? ' · ' + g + ' गोत्र को छोड़कर' : '');
  loadProfiles(false);
})();
</script>
</body></html>
